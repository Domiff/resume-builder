<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "DejaVu Sans", "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      line-height: 1.6;
      color: #2b2d33;
    }

    .header {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      color: #ffffff;
      padding: 32px 36px 26px;
      border-radius: 10px;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .contacts {
      font-size: 11px;
      color: #cbd5e1;
    }

    .contacts span {
      margin-right: 24px;
    }

    .contacts .label {
      color: #94a3b8;
      text-transform: uppercase;
      font-size: 8px;
      letter-spacing: 1px;
      margin-right: 6px;
    }

    .content {
      padding: 30px 6px 0;
    }

    .section {
      margin-bottom: 28px;
    }

    h2 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #1e293b;
      border-left: 3px solid #f59e0b;
      padding-left: 10px;
      margin-bottom: 12px;
    }

    .section p {
      margin-bottom: 6px;
      color: #44474f;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>{{ title }}</h1>
    <div class="contacts">
      <span><span class="label">Phone</span>{{ phone_number }}</span>
      <span><span class="label">Email</span>{{ email }}</span>
    </div>
  </div>

  <div class="content">
    <div class="section">
      <h2>Experience</h2>
      {{ experience|linebreaks }}
    </div>

    <div class="section">
      <h2>Education</h2>
      {{ education|linebreaks }}
    </div>
  </div>
</body>
</html>
