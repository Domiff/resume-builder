<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" href="../static/main.css">
  <style>
    @page {
      size: A4;
      margin: 32px;
    }

    body {
      font-family: "Inter", "Helvetica", Arial, sans-serif;
      font-size: 12px;
      line-height: 1.5;
      color: #2c2c2c;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 4px;
    }

    h2 {
      font-size: 16px;
      margin-top: 24px;
      margin-bottom: 8px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header {
      margin-bottom: 16px;
    }

    .contacts {
      color: #555;
      font-size: 11px;
    }

    .section {
      margin-bottom: 16px;
    }

    .section p {
      margin: 4px 0;
    }

    .layout {
      display: flex;
      gap: 24px;
    }

    .sidebar {
      width: 30%;
    }

    .main {
      width: 70%;
    }

    ul {
      padding-left: 16px;
      margin: 6px 0;
    }

    li {
      margin-bottom: 4px;
    }

    .highlight {
      color: #1f6feb;
      font-weight: 600;
    }

    .divider {
      height: 1px;
      background: #eee;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>{{ title }}</h1>
    <div class="contacts">
      <p>{{ phone_number }}</p>
      <p>{{ email }}</p>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="section">
        <h2>Education</h2>
        <p>{{ education }}</p>
      </div>
    </div>

    <div class="main">
      <div class="section">
        <h2>Experience</h2>
        <p>{{ experience }}</p>
      </div>
    </div>
  </div>
</body>
</html>
